<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 8 960 280" role="img" aria-labelledby="thicken-flow-dark-title thicken-flow-dark-desc">
  <title id="thicken-flow-dark-title">How thicken works</title>
  <desc id="thicken-flow-dark-desc">Photos, a video, words or an ISBN go in; thicken matches them to a profile (book, slab, card, box, badge, lettering, and more to come), processes them (the vision models find each face, cut it out and straighten it, and read what's printed), builds the object at its real size, and writes a GLB model and a JSON sidecar.</desc>
  <defs>
    <marker id="thicken-flow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9198a1"/>
    </marker>
  </defs>
  <rect y="8" width="960" height="280" fill="#0d1117"/>
  <g fill="none" stroke="#9198a1" stroke-width="1.2" marker-end="url(#thicken-flow-dark-arrow)">
    <path d="M160 52 H224 Q232 52 232 60 V116 Q232 124 240 124 H256"/>
    <path d="M160 116 H200 Q208 116 208 124 V132 Q208 140 216 140 H256"/>
    <path d="M160 180 H200 Q208 180 208 172 V164 Q208 156 216 156 H256"/>
    <path d="M160 244 H224 Q232 244 232 236 V180 Q232 172 240 172 H256"/>
    <path d="M400 148 H432"/>
    <path d="M576 148 H608"/>
    <path d="M752 132 H776 Q784 132 784 124 V108 Q784 100 792 100 H816"/>
    <path d="M752 164 H776 Q784 164 784 172 V188 Q784 196 792 196 H816"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="24" width="144" height="56" rx="20" fill="rgba(145,152,161,0.12)" stroke="#7d8590" stroke-width="1"/>
    <text x="88" y="48" fill="#e6edf3" font-size="16" font-weight="600">Photos</text>
    <text x="88" y="66" fill="#9198a1" font-size="12">or scans, artwork</text>
    <rect x="16" y="88" width="144" height="56" rx="20" fill="rgba(145,152,161,0.12)" stroke="#7d8590" stroke-width="1"/>
    <text x="88" y="112" fill="#e6edf3" font-size="16" font-weight="600">Video</text>
    <text x="88" y="130" fill="#9198a1" font-size="12">a phone's turn</text>
    <rect x="16" y="152" width="144" height="56" rx="20" fill="rgba(145,152,161,0.12)" stroke="#7d8590" stroke-width="1"/>
    <text x="88" y="176" fill="#e6edf3" font-size="16" font-weight="600">Words</text>
    <text x="88" y="194" fill="#9198a1" font-size="12">for lettering</text>
    <rect x="16" y="216" width="144" height="56" rx="20" fill="rgba(145,152,161,0.12)" stroke="#7d8590" stroke-width="1"/>
    <text x="88" y="240" fill="#e6edf3" font-size="16" font-weight="600">An ISBN</text>
    <text x="88" y="258" fill="#9198a1" font-size="12">a book by number</text>

    <rect x="256" y="108" width="144" height="80" rx="6" fill="#0d1117" stroke="#e6edf3" stroke-width="1"/>
    <text x="328" y="138" fill="#e6edf3" font-size="16" font-weight="600">Match a profile</text>
    <text x="328" y="158" fill="#9198a1" font-size="12">book, slab, card, box,</text>
    <text x="328" y="174" fill="#9198a1" font-size="12">badge, lettering, etc.</text>

    <rect x="432" y="108" width="144" height="80" rx="6" fill="#0d1117" stroke="#e6edf3" stroke-width="1"/>
    <text x="504" y="138" fill="#e6edf3" font-size="16" font-weight="600">Process</text>
    <text x="504" y="158" fill="#9198a1" font-size="12">faces found, cut,</text>
    <text x="504" y="174" fill="#9198a1" font-size="12">straightened, read</text>

    <rect x="608" y="108" width="144" height="80" rx="6" fill="rgba(224,183,76,0.12)" stroke="#e0b74c" stroke-width="1.2"/>
    <text x="680" y="138" fill="#e6edf3" font-size="16" font-weight="600">Build</text>
    <text x="680" y="158" fill="#9198a1" font-size="12">at its real size,</text>
    <text x="680" y="174" fill="#9198a1" font-size="12">in millimeters</text>

    <rect x="816" y="72" width="128" height="56" rx="20" fill="rgba(145,152,161,0.12)" stroke="#7d8590" stroke-width="1"/>
    <text x="880" y="96" fill="#e6edf3" font-size="16" font-weight="600">GLB model</text>
    <text x="880" y="114" fill="#9198a1" font-size="12">the 3D object</text>
    <rect x="816" y="168" width="128" height="56" rx="20" fill="rgba(145,152,161,0.12)" stroke="#7d8590" stroke-width="1"/>
    <text x="880" y="192" fill="#e6edf3" font-size="16" font-weight="600">JSON sidecar</text>
    <text x="880" y="210" fill="#9198a1" font-size="12">metadata</text>
  </g>
</svg>
