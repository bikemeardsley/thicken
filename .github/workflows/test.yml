# Type-check and test every push to main and every pull request, on fresh Windows, macOS and Linux machines:
# Thicken is for all three. It also catches what only works on one PC (an uncommitted file, a Windows-only path)
# and, once the repo is public, tests outside PRs.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Each has Chrome installed, so the preview test runs instead of skipping.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg, for the video test. Thicken needs it only for video, so people install it themselves.
      - name: Install ffmpeg
        shell: bash
        run: |
          if command -v ffmpeg; then exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - run: npm ci
      - run: npm run check
      - run: npm test
      # TEMPORARY: why the preview draws nothing on Windows CI.
      - name: Diagnose the preview
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          node diag-preview.mts chrome || true
          node diag-preview.mts msedge || true
          node diag-two.mts chrome || true
          node diag-two.mts msedge || true
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: diag-preview
          path: diag/
