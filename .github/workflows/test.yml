# Type-check and test every push to main and every pull request, on fresh Windows, macOS and Linux machines:
# Thicken is for all three. It also catches what only works on one PC (an uncommitted file, a Windows-only path)
# and, once the repo is public, tests outside PRs.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # After the file check on a fork's pull request, so a pull request that fails it runs none of its code here.
    needs: profile-only
    if: ${{ !cancelled() && needs.profile-only.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Each has Chrome installed, so the preview test runs instead of skipping.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg, for the video test. Thicken needs it only for video, so people install it themselves.
      - name: Install ffmpeg
        shell: bash
        run: |
          if command -v ffmpeg; then exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - run: npm ci
      - run: npm run check
      - run: npm test
      # As npm users get it: built to JavaScript (Node won't strip types in node_modules), installed, and run.
      - name: Install the package and run it
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && npm init -y > /dev/null && npm install ./thicken-*.tgz
          npx thicken badge "$GITHUB_WORKSPACE/test/fixtures/badge.png" -o badge.glb
          node --input-type=module -e "import { thicken } from 'thicken'; if (typeof thicken !== 'function') process.exit(1)"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | npx thicken mcp | grep -q '"serverInfo":{"name":"thicken"'
  # A pull request from a fork adds a profile (CONTRIBUTING.md): new files only, each a plain file under 1 MB, in
  # src/profiles, test/profiles and test/fixtures/<profile>/, plus the README's regenerated table. Editing, deleting
  # or renaming anything, a symlink, or the README beyond its table fails here, before any of its code runs.
  profile-only:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only a new profile's own files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          fail=0
          while IFS=$'\t' read -r meta file; do
            set -- $meta # :old-mode new-mode old-blob new-blob status
            if [[ "$5" == A && ( "$file" =~ ^src/profiles/[a-z][a-z0-9-]*\.ts$ || "$file" =~ ^test/profiles/[a-z][a-z0-9-]*\.test\.ts$ || "$file" =~ ^test/fixtures/[a-z][a-z0-9-]*/[^/]+$ ) ]] \
              || [[ "$5" == M && "$file" == README.md ]]; then
              if [ "$2" != 100644 ]; then echo "not a plain file: $file"; fail=1; fi
              if [ "$(git cat-file -s "$4")" -gt 1048576 ]; then echo "over 1 MB: $file"; fail=1; fi
            else
              echo "not a new profile's own file ($5): $file"; fail=1
            fi
          done < <(git diff --raw --no-renames --no-abbrev "origin/$BASE...HEAD")
          table() { sed '/<!-- profiles:start/,/<!-- profiles:end -->/d'; }
          if ! diff <(git show "origin/$BASE:README.md" | table) <(table < README.md) > /dev/null; then echo "README.md changed outside its table of profiles"; fail=1; fi
          if [ $fail = 1 ]; then echo "A profile pull request adds only a profile's own files: anything else starts as an issue (CONTRIBUTING.md)."; fi
          exit $fail
