# Type-check and test every push to main and every pull request, on fresh Windows, macOS and Linux machines:
# Thicken is for all three. It also catches what only works on one PC (an uncommitted file, a Windows-only path)
# and, once the repo is public, tests outside PRs.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Each has Chrome installed, so the preview test runs instead of skipping.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg, for the video test. Thicken needs it only for video, so people install it themselves.
      - name: Install ffmpeg
        shell: bash
        run: |
          if command -v ffmpeg; then exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - run: npm ci
      - run: npm run check
      - run: npm test
      # As npm users get it: built to JavaScript (Node won't strip types in node_modules), installed, and run.
      - name: Install the package and run it
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && npm init -y > /dev/null && npm install ./thicken-*.tgz
          npx thicken badge "$GITHUB_WORKSPACE/test/fixtures/badge.png" -o badge.glb
          node --input-type=module -e "import { thicken } from 'thicken'; if (typeof thicken !== 'function') process.exit(1)"
  # A pull request from a fork adds a profile (CONTRIBUTING.md), so it touches only that profile's own files: its
  # source, its tests, fixtures, and the README's regenerated table. Anything more fails here, for a closer look.
  profile-only:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only a profile's own files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          outside=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '^(src/profiles/[a-z0-9-]+\.ts|test/profiles/[a-z0-9-]+\.test\.ts|test/fixtures/.+|README\.md)$' || true)
          if [ -n "$outside" ]; then printf 'Outside a profile'"'"'s own files (open an issue first):\n%s\n' "$outside"; exit 1; fi
