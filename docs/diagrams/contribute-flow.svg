<svg xmlns="http://www.w3.org/2000/svg" width="960" height="816" viewBox="0 0 960 816" role="img" aria-labelledby="contribute-flow-title contribute-flow-desc">
  <title id="contribute-flow-title">Contributing photos to the corner model</title>
  <desc id="contribute-flow-desc">A thicken user who said yes once sends each photo's frame and proposed corners to the relay, which runs eleven checks in turn and keeps what passes in an EU inbox; the author pulls new photos into Label Studio, reviews each one, and only reviewed rows train the corner model, while a contributor can forget a photo at any time.</desc>
  <style>
    /* Dark, for a viewer whose browser prefers it: one file, so a plain img shows it on GitHub and npm alike. */
    @media (prefers-color-scheme: dark) {
      [fill="#ffffff"] { fill: #0d1117 }
      [fill="#15181c"] { fill: #e6edf3 }
      [stroke="#15181c"] { stroke: #e6edf3 }
      [fill="#57606a"] { fill: #9198a1 }
      [stroke="#57606a"] { stroke: #9198a1 }
      [stroke="#6e7781"] { stroke: #7d8590 }
      [fill="rgba(87,96,106,0.10)"] { fill: rgba(145,152,161,0.12) }
      [fill="rgba(184,144,47,0.10)"] { fill: rgba(224,183,76,0.12) }
      [stroke="#b8902f"] { stroke: #e0b74c }
    }
  </style>
  <defs>
    <marker id="contribute-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="960" height="816" fill="#ffffff"/>

  <!-- Lanes: their machine, the relay, your machine -->
  <g stroke="#6e7781" stroke-width="0.8">
    <line x1="244" y1="24" x2="244" y2="720"/>
    <line x1="704" y1="24" x2="704" y2="720"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="128" y="40" fill="#57606a" font-size="12" font-weight="600" letter-spacing="0.08em">A USER'S MACHINE</text>
    <text x="128" y="56" fill="#57606a" font-size="12">thicken</text>
    <text x="476" y="40" fill="#57606a" font-size="12" font-weight="600" letter-spacing="0.08em">THE RELAY</text>
    <text x="476" y="56" fill="#57606a" font-size="12">contribute.wendellresearch.ai</text>
    <text x="828" y="40" fill="#57606a" font-size="12" font-weight="600" letter-spacing="0.08em">YOUR MACHINE</text>
    <text x="828" y="56" fill="#57606a" font-size="12">pull.ts, Label Studio, training</text>
  </g>

  <!-- Arrows first, so the boxes sit on top of them -->
  <g fill="none" stroke="#57606a" stroke-width="1.2" marker-end="url(#contribute-flow-arrow)">
    <!-- their machine -->
    <path d="M128 160 V176"/>
    <path d="M128 248 V280"/>
    <path d="M224 316 H228 Q236 316 236 308 V116 Q236 108 244 108 H264"/>
    <!-- the relay's checks, in order: down the left, then down the right -->
    <path d="M364 144 V160"/>
    <path d="M364 216 V232"/>
    <path d="M364 288 V304"/>
    <path d="M364 360 V376"/>
    <path d="M364 432 V448"/>
    <path d="M464 476 H468 Q476 476 476 468 V124 Q476 116 484 116 H488"/>
    <path d="M588 144 V160"/>
    <path d="M588 216 V232"/>
    <path d="M588 288 V304"/>
    <path d="M588 360 V376"/>
    <!-- to your machine -->
    <path d="M688 188 H728"/>
    <path d="M688 404 H728"/>
    <path d="M688 492 Q696 492 696 484 V428 Q696 420 704 420 H728"/>
    <path d="M828 432 V464"/>
    <path d="M828 536 V568"/>
    <path d="M828 624 V656"/>
  </g>
  <g fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#contribute-flow-arrow)">
    <path d="M128 352 V384"/>
    <path d="M224 412 H244 Q252 412 252 404 V136 Q252 128 260 128 H264"/>
    <path d="M224 644 H580 Q588 644 588 636 V520"/>
  </g>

  <!-- Arrow labels, each on open canvas above or beside its line -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
    <rect x="136" y="360" width="84" height="16" fill="#ffffff"/>
    <text x="140" y="372" fill="#57606a">if unreachable</text>
    <rect x="692" y="164" width="32" height="16" fill="#ffffff"/>
    <text x="708" y="176" fill="#57606a" text-anchor="middle">match</text>
    <rect x="300" y="620" width="96" height="16" fill="#ffffff"/>
    <text x="348" y="632" fill="#57606a" text-anchor="middle">any time, by id</text>
    <rect x="836" y="544" width="80" height="16" fill="#ffffff"/>
    <text x="840" y="556" fill="#57606a">kept or fixed</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Their machine -->
    <rect x="32" y="88" width="192" height="72" rx="20" fill="rgba(87,96,106,0.10)" stroke="#6e7781" stroke-width="1"/>
    <text x="128" y="112" fill="#15181c" font-size="16" font-weight="600">Run thicken</text>
    <text x="128" y="132" fill="#57606a" font-size="12">photos of a book, box, card</text>
    <text x="128" y="148" fill="#57606a" font-size="12">or slab in, a 3D model out</text>

    <rect x="32" y="176" width="192" height="72" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="128" y="200" fill="#15181c" font-size="16" font-weight="600">Asked once</text>
    <text x="128" y="220" fill="#57606a" font-size="12">yes or no; no answer is no</text>
    <text x="128" y="236" fill="#57606a" font-size="12">at a terminal, MCP or install</text>

    <rect x="32" y="280" width="192" height="72" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="128" y="304" fill="#15181c" font-size="16" font-weight="600">Frame each photo</text>
    <text x="128" y="324" fill="#57606a" font-size="12">1000 × 1000, pixels only,</text>
    <text x="128" y="340" fill="#57606a" font-size="12">with the proposed corners</text>

    <rect x="32" y="384" width="192" height="56" rx="6" fill="rgba(87,96,106,0.10)" stroke="#6e7781" stroke-width="1"/>
    <text x="128" y="408" fill="#15181c" font-size="16" font-weight="600">Outbox</text>
    <text x="128" y="426" fill="#57606a" font-size="12">waits for the next run</text>

    <rect x="32" y="616" width="192" height="56" rx="20" fill="rgba(87,96,106,0.10)" stroke="#6e7781" stroke-width="1"/>
    <text x="128" y="640" fill="#15181c" font-size="16" font-weight="600">Forget a photo</text>
    <text x="128" y="658" fill="#57606a" font-size="12">thicken contribute forget</text>

    <!-- The relay: eleven checks, then what it keeps -->
    <rect x="264" y="88" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="364" y="112" fill="#15181c" font-size="16" font-weight="600">1. Open?</text>
    <text x="364" y="130" fill="#57606a" font-size="12">else 503, or 410 once ended</text>

    <rect x="264" y="160" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="364" y="184" fill="#15181c" font-size="16" font-weight="600">2. Per-minute limit</text>
    <text x="364" y="202" fill="#57606a" font-size="12">5 a minute; else 429</text>

    <rect x="264" y="232" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="364" y="256" fill="#15181c" font-size="16" font-weight="600">3. Size</text>
    <text x="364" y="274" fill="#57606a" font-size="12">1.5 MB at most; else 413</text>

    <rect x="264" y="304" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="364" y="328" fill="#15181c" font-size="16" font-weight="600">4. Meta</text>
    <text x="364" y="346" fill="#57606a" font-size="12">its exact shape; else 400</text>

    <rect x="264" y="376" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="364" y="400" fill="#15181c" font-size="16" font-weight="600">5. A real JPEG</text>
    <text x="364" y="418" fill="#57606a" font-size="12">1024 px at most; else 415</text>

    <rect x="264" y="448" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="364" y="472" fill="#15181c" font-size="16" font-weight="600">6. Not a repeat</text>
    <text x="364" y="490" fill="#57606a" font-size="12">a repeat stores nothing</text>

    <rect x="488" y="88" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="588" y="112" fill="#15181c" font-size="16" font-weight="600">7. Day caps</text>
    <text x="588" y="130" fill="#57606a" font-size="12">network, ASN, total; else 429</text>

    <rect x="488" y="160" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="588" y="184" fill="#15181c" font-size="16" font-weight="600">8. Abuse hash lists</text>
    <text x="588" y="202" fill="#57606a" font-size="12">four lists, asked at once</text>

    <rect x="488" y="232" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="588" y="256" fill="#15181c" font-size="16" font-weight="600">9. Re-encode</text>
    <text x="588" y="274" fill="#57606a" font-size="12">any metadata dropped</text>

    <rect x="488" y="304" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="588" y="328" fill="#15181c" font-size="16" font-weight="600">10. AI checks</text>
    <text x="588" y="346" fill="#57606a" font-size="12">sexual? face? topic? else 422</text>

    <rect x="488" y="376" width="200" height="56" rx="6" fill="rgba(87,96,106,0.10)" stroke="#6e7781" stroke-width="1"/>
    <text x="588" y="400" fill="#15181c" font-size="16" font-weight="600">11. EU inbox</text>
    <text x="588" y="418" fill="#57606a" font-size="12">deleted after 180 days</text>

    <rect x="488" y="464" width="200" height="56" rx="6" fill="rgba(87,96,106,0.10)" stroke="#6e7781" stroke-width="1"/>
    <text x="588" y="488" fill="#15181c" font-size="16" font-weight="600">Forgotten ids</text>
    <text x="588" y="506" fill="#57606a" font-size="12">so your copy goes too</text>

    <!-- Your machine -->
    <rect x="728" y="160" width="200" height="72" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="828" y="184" fill="#15181c" font-size="16" font-weight="600">Report to NCMEC</text>
    <text x="828" y="204" fill="#57606a" font-size="12">the photo locked a year,</text>
    <text x="828" y="220" fill="#57606a" font-size="12">uploads paused until then</text>

    <rect x="728" y="376" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="828" y="400" fill="#15181c" font-size="16" font-weight="600">Pull new photos</text>
    <text x="828" y="418" fill="#57606a" font-size="12">relay/pull.ts, run by hand</text>

    <rect x="728" y="464" width="200" height="72" rx="6" fill="rgba(184,144,47,0.10)" stroke="#b8902f" stroke-width="1.2"/>
    <text x="828" y="488" fill="#15181c" font-size="16" font-weight="600">Your review</text>
    <text x="828" y="508" fill="#57606a" font-size="12">in Label Studio: keep, fix,</text>
    <text x="828" y="524" fill="#57606a" font-size="12">or reject (deleted everywhere)</text>

    <rect x="728" y="568" width="200" height="56" rx="6" fill="rgba(87,96,106,0.10)" stroke="#6e7781" stroke-width="1"/>
    <text x="828" y="592" fill="#15181c" font-size="16" font-weight="600">Reviewed rows</text>
    <text x="828" y="610" fill="#57606a" font-size="12">review.jsonl, contributed</text>

    <rect x="728" y="656" width="200" height="56" rx="6" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="828" y="680" fill="#15181c" font-size="16" font-weight="600">Train the corner model</text>
    <text x="828" y="698" fill="#57606a" font-size="12">experiment 003, once AI-014</text>
  </g>

  <!-- Legend -->
  <line x1="16" y1="744" x2="944" y2="744" stroke="#6e7781" stroke-width="0.8"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
    <rect x="16" y="760" width="32" height="16" rx="8" fill="rgba(87,96,106,0.10)" stroke="#6e7781" stroke-width="1"/>
    <text x="56" y="772" fill="#57606a">a person's step</text>
    <rect x="176" y="760" width="32" height="16" rx="4" fill="#ffffff" stroke="#15181c" stroke-width="1"/>
    <text x="216" y="772" fill="#57606a">a step or check</text>
    <rect x="336" y="760" width="32" height="16" rx="4" fill="rgba(87,96,106,0.10)" stroke="#6e7781" stroke-width="1"/>
    <text x="376" y="772" fill="#57606a">kept</text>
    <rect x="432" y="760" width="32" height="16" rx="4" fill="rgba(184,144,47,0.10)" stroke="#b8902f" stroke-width="1.2"/>
    <text x="472" y="772" fill="#57606a">your review: nothing trains before it</text>
    <line x1="728" y1="768" x2="760" y2="768" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="768" y="772" fill="#57606a">later, or retried</text>
    <text x="16" y="800" fill="#57606a">A check that fails answers with its reason, and the photo goes no further; thicken lists it in thicken contribute list.</text>
  </g>
</svg>
